name: Build Project OTA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "OTA Version"
        required: true
        default: "0.2.1"

permissions:
  contents: write

jobs:
  build-ota:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip \
            jq \
            openssl \
            shellcheck

      - name: Run ShellCheck
        run: |
          find . \
            -type f \
            -name "*.sh" \
            -print0 \
            | xargs -0 -r shellcheck

      - name: Build OTA Package
        run: |
          chmod +x ota/build-package.sh

          ./ota/build-package.sh \
            "${{ github.event.inputs.version }}"

      - name: Run OTA Security Tests
        run: |
          if [ -f tests/run-security-tests.sh ]; then
            chmod +x tests/run-security-tests.sh
            ./tests/run-security-tests.sh
          else
            echo "No OTA security test suite found."
          fi

      - name: Verify Release Files
        run: |
          echo "Contents of build/releases:"
          ls -lah build/releases || true

      - name: Upload OTA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Project-OTA
          path: |
            build/releases/*.zip

      - name: Publish OTA Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Project-v${{ github.event.inputs.version }}
          name: Project v${{ github.event.inputs.version }}
          generate_release_notes: true
          files: |
            build/releases/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Final Debug
        if: always()
        run: |
          echo "Build finished."
          find build -type f 2>/dev/null || true
