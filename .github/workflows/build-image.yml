name: Build Project Installation Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Project Version"
        required: true
        default: "0.2.0"

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            p7zip-full \
            xz-utils \
            gh

      - name: Create Working Directories
        run: |
          mkdir -p downloads
          mkdir -p output

      - name: Download Base Firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download 20261008 \
            --repo lcdyk0517/arkos4clone \
            --pattern "dArkOS4Clone-20261008.img.xz.7z.*" \
            --dir downloads

      - name: Extract Split Archive
        run: |
          cd downloads

          7z x \
            dArkOS4Clone-20261008.img.xz.7z.001

      - name: Extract Image
        run: |
          cd downloads

          xz -d \
            dArkOS4Clone-20261008.img.xz

      - name: Rename Image
        run: |
          cd downloads

          mv \
            dArkOS4Clone-20261008.img \
            Project
