name: Project Image Builder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full xz-utils gh

      - name: Create Download Directory
        run: mkdir -p downloads

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download 20261008 \
            --repo lcdyk0517/arkos4clone \
            --dir downloads

      - name: Show Downloaded Files
        run: |
          find downloads -type f

      - name: Join Split Archive
        run: |
          cd downloads

          cat \
            dArkOS4Clone-20261008.img.xz.7z.001 \
            dArkOS4Clone-20261008.img.xz.7z.002 \
            dArkOS4Clone-20261008.img.xz.7z.003 \
            > dArkOS4Clone-20261008.img.xz.7z

      - name: Extract 7z Archive
        run: |
          cd downloads
          7z x dArkOS4Clone-20261008.img.xz.7z

      - name: Extract XZ Archive
        run: |
          cd downloads
          xz -d dArkOS4Clone-20261008.img.xz

      - name: Verify Image
        run: |
          find downloads -name "*.img"

      - name: Generate Tag
        id: tag
        run: |
          echo "tag=Project-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            downloads/*.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
