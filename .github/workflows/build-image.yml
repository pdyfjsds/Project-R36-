name: Project Extract Test

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full xz-utils gh

      - name: Create Downloads Folder
        run: |
          mkdir -p downloads

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download 20261008 \
            --repo lcdyk0517/arkos4clone \
            --dir downloads

      - name: Show Downloaded Files
        run: |
          find downloads -type f

      - name: Extract Split 7z Archive
        run: |
          cd downloads

          7z x dArkOS4Clone-20261008.img.xz.7z.001

      - name: Show Files After Extraction
        run: |
          find downloads -type f

      - name: Extract XZ
        run: |
          cd downloads

          xz -d dArkOS4Clone-20261008.img.xz

      - name: Verify IMG
        run: |
          find downloads -name "*.img"
