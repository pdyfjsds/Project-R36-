name: Project Image Builder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            p7zip-full \
            xz-utils \
            gh

      - name: Create Downloads Folder
        run: |
          mkdir -p downloads

      - name: Verify Workspace
        run: |
          echo "Current Directory:"
          pwd

          echo ""
          echo "Repository Files:"
          find . -type f

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download 20261008 \
            --repo lcdyk0517/arkos4clone \
            --dir downloads

      - name: Show Downloaded Files
        run: |
          echo "Downloaded Assets:"
          find downloads -type f

      - name: Verify Required Parts
        run: |
          cd downloads

          ls -lah

          test -f dArkOS4Clone-20261008.img.xz.7z.001
          test -f dArkOS4Clone-20261008.img.xz.7z.002
          test -f dArkOS4Clone-20261008.img.xz.7z.003

          echo "All 3 parts found."

      - name: Join Parts
        run: |
          cd downloads

          cat \
            dArkOS4Clone-20261008.img.xz.7z.001 \
