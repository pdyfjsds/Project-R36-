name: Project Build

on:
  workflow_dispatch:
    inputs:
      package_type:
        description: "Choose output type"
        required: true
        default: "img"
        type: choice
        options:
          - img
          - update

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            p7zip-full \
            xz-utils \
            zip \
            gh

      - name: Create Downloads Folder
        run: |
          mkdir -p downloads

      - name: Download dArkOS4Clone Only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download 20261008 \
            --repo lcdyk0517/arkos4clone \
            --pattern "dArkOS4Clone-20261008.img.xz.7z.*" \
            --dir downloads

      - name: Show Downloaded Files
        run: |
          echo "Downloaded:"
          find downloads -type f

      - name: Verify Parts
        run: |
          test -f downloads/dArkOS4Clone-20261008.img.xz.7z.001
          test -f downloads/dArkOS4Clone-20261008.img.xz.7z.002
          test -f downloads/dArkOS4Clone-20261008.img.xz.7z.003

      - name: Extract Split Archive
        run: |
          cd downloads

          7z x dArkOS4Clone-20261008.img.xz.7z.001

      - name: Verify XZ Exists
        run: |
          find downloads -name "*.xz"

      - name: Extract XZ
        run: |
          cd downloads

          xz -d dArkOS4Clone-20261008.img.xz

      - name: Verify IMG Exists
        run: |
          find downloads -name "*.img"

      - name: Create Update Package
        if: ${{ inputs.package_type == 'update' }}
        run: |
          mkdir update

          cp downloads/*.img update/

          cd update

          zip -r Project-Update.zip .

      - name: Upload IMG Artifact
        if: ${{ inputs.package_type == 'img' }}
        uses: actions/upload-artifact@v4
        with:
          name: Project-Image
          path: downloads/*.img

      - name: Upload Update Artifact
        if: ${{ inputs.package_type == 'update' }}
        uses: actions/upload-artifact@v4
        with:
          name: Project
